map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ------------------------------------------------------------
# 80 端口：放行证书校验路径，其余全部 301 跳 HTTPS
# 注意：/.well-known 必须在跳转之前，否则 certbot 续期会失败
# ------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name mianba.vip www.mianba.vip;

    # Let's Encrypt HTTP-01 校验（续期也走这里）
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    # 健康检查如果必须走 http，把下面这段注释放开
    # location = /actuator/health {
    #     proxy_pass http://backend:23333;
    #     proxy_set_header Host $host;
    # }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------
# 443 端口：HTTPS 主站
# ------------------------------------------------------------
server {
    listen 443 ssl;
    # nginx >= 1.25.1 用这一行；老版本改成 listen 443 ssl http2; 并删掉本行
    http2 on;
    server_name mianba.vip www.mianba.vip;

    # ----- 证书 -----
    ssl_certificate     /etc/letsencrypt/live/mianba.vip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mianba.vip/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/mianba.vip/chain.pem;

    # ----- TLS 加固 -----
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS：确认 HTTPS 稳定后再开，开了就很难回退
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 50m;

    # ----- /api/ 反向代理（含 SSE 流式） -----
    location /api/ {
        proxy_pass http://backend:23333;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 三件套：关缓冲 + 关 gzip + 长超时
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        add_header X-Accel-Buffering no;   # 防止上游/全局配置重新开启缓冲

        # 讲解/答疑等 SSE 流式接口在思考模型下可能在首字节前或分段间出现较长静默；
        # 放宽到 1 小时，防止 nginx 在模型"想"得久时提前 502。
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # WebSocket 升级（无 WS 接口可删，留着对普通请求无副作用）
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location /actuator/health {
        proxy_pass http://backend:23333;
        proxy_set_header Host $host;
        access_log off;
    }

    # ----- Web 应用（SPA，HashRouter，保留 try_files） -----
    location /app/ {
        try_files $uri $uri/ /app/index.html;
    }

    location /app {
        return 301 /app/;
    }

    # ----- 官网落地页（静态单页） -----
    location / {
        try_files $uri $uri/ /index.html;
    }
}
