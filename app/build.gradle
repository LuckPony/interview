plugins {
    id 'java'
    alias(libs.plugins.spring.boot)
    alias(libs.plugins.spring.dependency.management)
}

group = 'com.interview'
version = '0.0.1-SNAPSHOT'

repositories {
    maven{ url = uri('https://maven.aliyun.com/repository/public/')}
    maven{ url = uri('https://maven.aliyun.com/repository/spring/')}
    mavenCentral()
    maven { url = uri('https://repo.spring.io/milestone')}
}

dependencies {
    // Web + Validation + Actuator
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
    // OpenAPI 3 + Swagger UI
    implementation libs.springdoc

    // Database
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.flywaydb:flyway-database-postgresql'

    // Lombok
    compileOnly libs.lombok
    annotationProcessor libs.lombok

    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testRuntimeOnly 'com.h2database:h2'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    runtimeOnly 'org.postgresql:postgresql'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    //Flyway数据库迁移
    implementation 'org.springframework.boot:spring-boot-starter-flyway'

    // MapStruct 对象映射
    implementation libs.mapstruct
    annotationProcessor libs.mapstruct.processor

    // Spring AI BOM（统一版本管理）
    implementation platform("org.springframework.ai:spring-ai-bom:${libs.versions.springAi.get()}")

    // Spring AI OpenAI 兼容模式（用于 DashScope / DeepSeek / Kimi 等）
    implementation 'org.springframework.ai:spring-ai-openai'
    implementation 'org.springframework.ai:spring-ai-client-chat'

    //文件解析
    implementation libs.tika.core
    implementation libs.tika.parsers

    // ===== Drill 模块：安全与 JWT 鉴权 =====
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    // ===== Redis：spring-data-redis + Lettuce =====
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    // 单元测试 mock RedisConnectionFactory 用（spring-boot-starter-test 未包含 Mockito 时）
    testImplementation 'org.mockito:mockito-core'

    // ===== 注册登录：邮箱验证 =====
    implementation 'org.springframework.boot:spring-boot-starter-mail'

}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('test'){
    useJUnitPlatform()
}

bootRun {
    // 本地开发：macOS 上系统开了 SOCKS/HTTP/HTTPS 代理（scutil 可见，均指向 127.0.0.1:65532）。
    // 不能简单把 http.proxyHost 设空（AWS S3 SDK 会报“host 为空”），正确做法是：
    //   1) useSystemProxies=false 关掉系统代理自动探测；
    //   2) socksProxyHost= 显式清掉 SOCKS；
    //   3) nonProxyHosts 让 localhost/127.0.0.1 直连（绕过代理），外部 LLM 域名仍走代理。
    jvmArgs '-Djava.net.useSystemProxies=false',
            '-DsocksProxyHost=',
            '-Dhttp.nonProxyHosts=localhost|127.0.0.1|*.local',
            '-DsocksNonProxyHosts=localhost|127.0.0.1|*.local'
}
