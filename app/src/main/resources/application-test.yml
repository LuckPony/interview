spring:
  datasource:
    url: ${APP_TEST_DATASOURCE_URL:jdbc:postgresql://localhost:5432/interview_test}
    driver-class-name: org.postgresql.Driver
    username: ${APP_TEST_DATASOURCE_USERNAME:postgres}
    password: ${APP_TEST_DATASOURCE_PASSWORD:123456}

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: false

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 4
          max-idle: 2
          min-idle: 0
