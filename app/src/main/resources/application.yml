server:
  port: 23333  # 非主流端口：避开 8080 等常用端口被占（曾导致桌面端后端起不来）
  tomcat:
    # SSE 流式响应跑在 servlet 异步线程上，Tomcat 默认 async 超时很短（~30s），
    # 思考模式下模型"想"得久，响应易超时被掐断 → 客户端收到 terminated → 前端报"回复失败"。
    # 放宽到 10 分钟，与 DeepSeek 流式 300s 超时对齐。
    async-timeout: 600000

spring:
  application:
    name: interview-platform
  threads:
    virtual:
      enabled: true
  datasource:
    # PostgreSQL 是唯一运行时数据库；本地开发默认连接 docker-compose.dev.yml 中的 iv-postgres。
    url: ${APP_DATASOURCE_URL:jdbc:postgresql://103.236.92.40:5454/interview}
    username: ${APP_DATASOURCE_USERNAME:postgres}
    password: ${APP_DATASOURCE_PASSWORD:123456}
    driver-class-name: ${APP_DATASOURCE_DRIVER:org.postgresql.Driver}
  data:
    redis:
      # 本地开发默认访问云端 Redis
      # Docker 部署时由 SPRING_DATA_REDIS_HOST=redis 覆盖
      host: ${SPRING_DATA_REDIS_HOST:103.236.92.40}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: 3000ms

      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
  jpa:
    hibernate:
      # schema 由 Flyway 全权管理，Hibernate 不再做严格类型校验（避免 SMALLINT/INTEGER 之类良性差异报错）
      ddl-auto: none

    show-sql: false
    properties:
      hibernate:
        format_sql: true
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB
  flyway:
    enabled: true
    # 全部迁移统一放在 common（共享同一版本历史）；应用仅使用 PostgreSQL，无方言分流
    locations: classpath:db/migration/common
    # 开发环境容错：库里的 flyway_schema_history 与脚本历史可能存在漂移
    # （迁移脚本 V2~V12 曾未提交 git、V2 又被改动过），默认 validate 会在启动时直接崩。
    # 这里关闭启动校验：不再比对已应用迁移的 checksum / 缺失状态，
    # 新增迁移（如 V14 加列）照常执行；生产环境应去掉此容错并修复历史后再开。
    validate-on-migrate: false
    # 允许按乱序补跑中间缺失的迁移（如库历史里缺 V8、但 V9+ 已应用）
    out-of-order: true
    baseline-on-migrate: true
    baseline-version: 1
  mail:
    # 邮箱验证：不配 MAIL_HOST/FROM 则注册自动通过（本地/演示）
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
springdoc:
  # 生产默认关闭（避免把全部接口结构暴露给公网）；本地开发设 APP_SWAGGER_ENABLED=true 打开
  api-docs:
    enabled: ${APP_SWAGGER_ENABLED:false}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${APP_SWAGGER_ENABLED:false}
    path: /swagger
    tags-sorter: alpha
    operations-sorter: alpha
    try-it-out-enabled: true
    persist-authorization: true
  packages-to-scan: interview.homegrown.modules

app:
  storage:
    endpoint: ${APP_STORAGE_ENDPOINT:https://103.236.92.40:9000}
    access-key: ${APP_STORAGE_ACCESS_KEY:minioadmin}
    secret-key: ${APP_STORAGE_SECRET_KEY:minioadmin}
    bucket: ${APP_STORAGE_BUCKET:interview}
    region: ${APP_STORAGE_REGION:us-east-1}
  ai:
    #默认使用的Provider
    default-provider: deepseek
    #结构化输出重试配置
    structured:
      max-attempts: 2      #结构化输出已关闭思考（快），失败时再重试 1 次并注入错误，提高解析成功率
      include-last-error: true      #重试时将错误注入提示词
    #多Provider定义
    # 注意：这里【不再配置任何默认/共享 API Key】。每个用户必须在「设置」页填自己的 key
    # （Web 端按账号保存；桌面端只存本机、随请求头 X-LLM-Key 临时传入）。
    # 下面仅提供 base-url / model 默认值供设置页预填，key 一律留空 → 未配置则明确提示用户。
    providers:
      dashscope:
        base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
        api-key: ""
        model: ${MODEL_NAME:qwen3.7-flash}
        temperature: 0.7
      deepseek:
        base-url: https://api.deepseek.com
        api-key: ""
        model: ${MODEL_NAME:deepseek-chat}
        temperature: 0.7
      kimi:
        base-url: https://api.moonshot.cn/v1
        api-key: ""
        model: kimi-latest
        temperature: 0.7

  file:
    max-size: 52428800
    allowed-types:
      - application/pdf
      - application/msword
      - application/vnd.openxmlformats-officedocument.wordprocessingml.document
      - text/plain
  jwt:
    secret: ${APP_JWT_SECRET:drill-dev-secret-change-me-please-32bytes}
    expiration-ms: 5184000000  # 2 个月（60 天）
  mail:
    from: ${MAIL_FROM:}

interview:
  follow-up-count: ${APP_INTERVIEW_FOLLOW_UP_COUNT:2}
  # Skill 面试方向定义（key 为 skillId）
  skills:
    java-backend:
      name: Java 后端
      description: Java 核心、Spring 生态、并发、JVM、分布式、数据库等
      default-question-count: ${DEFAULT_QUESTION_COUNT:5}
    frontend:
      name: 前端
      description: JavaScript/TypeScript、框架原理、浏览器、工程化等
      default-question-count: ${DEFAULT_QUESTION_COUNT:5}
    python:
      name: Python
      description: Python 基础、常用框架、数据分析等
      default-question-count: ${DEFAULT_QUESTION_COUNT:5}
    algorithm:
      name: 算法
      description: 数据结构、算法思想、复杂度分析等
      default-question-count: ${DEFAULT_QUESTION_COUNT:5}
    system-design:
      name: 系统设计
      description: 高并发、高可用、缓存、消息队列、微服务等
      default-question-count: ${DEFAULT_QUESTION_COUNT:5}
    database:
      name: 数据库
      description: MySQL、索引、事务、锁、Redis、分库分表等
      default-question-count: ${DEFAULT_QUESTION_COUNT:5}


management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  health:
    mail:
      # 不配邮箱时 JavaMailSender 连不上 → mail 指示器 DOWN → 整体 health 变 DOWN，
      # 会误导桌面端探活判定"后端未就绪"。这里屏蔽 mail 健康指示器。
      enabled: false
