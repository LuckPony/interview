server:
  port: 8080
  tomcat:
    # SSE 流式响应跑在 servlet 异步线程上，Tomcat 默认 async 超时很短（~30s），
    # 思考模式下模型"想"得久，响应易超时被掐断 → 客户端收到 terminated → 前端报"回复失败"。
    # 放宽到 10 分钟，与 DeepSeek 流式 300s 超时对齐。
    async-timeout: 600000

spring:
  application:
    name: interview-platform
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:interview}
    username: ${POSTGRES_USER:pony}
    password: ${POSTGRES_PASSWORD:123456}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # schema 由 Flyway 全权管理，Hibernate 不再做严格类型校验（避免 SMALLINT/INTEGER 之类良性差异报错）
      ddl-auto: none

    show-sql: false
    properties:
      hibernate:
        format_sql: true
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 3000ms
  mail:
    # 邮箱验证：不配 MAIL_HOST/FROM 则注册自动通过（本地/演示）
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
springdoc:
  # 生产默认关闭（避免把全部接口结构暴露给公网）；本地开发设 APP_SWAGGER_ENABLED=true 打开
  api-docs:
    enabled: ${APP_SWAGGER_ENABLED:false}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${APP_SWAGGER_ENABLED:false}
    path: /swagger
    tags-sorter: alpha
    operations-sorter: alpha
    try-it-out-enabled: true
    persist-authorization: true
  packages-to-scan: interview.homegrown.modules

app:
  storage:
    endpoint: ${APP_STORAGE_ENDPOINT:http://localhost:9000}
    access-key: ${APP_STORAGE_ACCESS_KEY:minioadmin}
    secret-key: ${APP_STORAGE_SECRET_KEY:minioadmin}
    bucket: ${APP_STORAGE_BUCKET:interview}
    region: ${APP_STORAGE_REGION:us-east-1}
  ai:
    #默认使用的Provider
    default-provider: deepseek
    #结构化输出重试配置
    structured:
      max-attempts: 1      #推理模型每次几十秒，解析失败不再重试（避免 3 分钟）；解析成功率靠原生直连 + extractJson 兜底
      include-last-error: true      #重试时将错误注入提示词
    #多Provider定义
    providers:
      dashscope:
        base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
        # 当前用户只有 DeepSeek key，阿里 key 留空则该 provider 跳过初始化
        api-key: ${DASHSCOPE_API_KEY:}
        # 读 .env 里的 MODEL_NAME；未设则退回默认值
        model: ${MODEL_NAME:qwen3.7-flash}
        temperature: 0.7
      deepseek:
        base-url: https://api.deepseek.com
        # 云端不再共享服务器 key：留空则本 provider 不初始化，每个用户在「设置」页用自己的 key
        # （桌面端 key 仅存本机、随请求临时传入；本地模式可继续用 .env 的 API_KEY）
        api-key: ${API_KEY:}
        # 读 .env 里的 MODEL_NAME；未设则退回默认值
        model: ${MODEL_NAME:deepseek-chat}
        temperature: 0.7
      kimi:
        base-url: https://api.moonshot.cn/v1
        api-key: ${PROVIDER_KIMI_API_KEY}
        model: kimi-latest
        temperature: 0.7

  file:
    max-size: 52428800
    allowed-types:
      - application/pdf
      - application/msword
      - application/vnd.openxmlformats-officedocument.wordprocessingml.document
      - text/plain
  jwt:
    secret: ${APP_JWT_SECRET:drill-dev-secret-change-me-please-32bytes}
    expiration-ms: 86400000   # 24h
  mail:
    from: ${MAIL_FROM:}

interview:
  follow-up-count: ${APP_INTERVIEW_FOLLOW_UP_COUNT:2}
  # Skill 面试方向定义（key 为 skillId）
  skills:
    java-backend:
      name: Java 后端
      description: Java 核心、Spring 生态、并发、JVM、分布式、数据库等
      default-question-count: ${DEFAULT_QUESTION_COUNT:5}
    frontend:
      name: 前端
      description: JavaScript/TypeScript、框架原理、浏览器、工程化等
      default-question-count: ${DEFAULT_QUESTION_COUNT:5}
    python:
      name: Python
      description: Python 基础、常用框架、数据分析等
      default-question-count: ${DEFAULT_QUESTION_COUNT:5}
    algorithm:
      name: 算法
      description: 数据结构、算法思想、复杂度分析等
      default-question-count: ${DEFAULT_QUESTION_COUNT:5}
    system-design:
      name: 系统设计
      description: 高并发、高可用、缓存、消息队列、微服务等
      default-question-count: ${DEFAULT_QUESTION_COUNT:5}
    database:
      name: 数据库
      description: MySQL、索引、事务、锁、Redis、分库分表等
      default-question-count: ${DEFAULT_QUESTION_COUNT:5}


management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
