server:
  port: 8080

spring:
  application:
    name: interview-platform
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:interview}
    username: ${POSTGRES_USER:pony}
    password: ${POSTGRES_PASSWORD:123456}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop

    show-sql: false
    properties:
      hibernate:
        format_sql: true
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
springdoc:
  swagger-ui:
    path: /swagger
    tags-sorter: alpha
    operations-sorter: alpha
    try-it-out-enabled: true
    persist-authorization: true
  api-docs:
    path: /v3/api-docs
  packages-to-scan: interview.homegrown.modules

app:
  storage:
    endpoint: ${APP_STORAGE_ENDPOINT:http://localhost:9000}
    access-key: ${APP_STORAGE_ACCESS_KEY:minioadmin}
    secret-key: ${APP_STORAGE_SECRET_KEY:minioadmin}
    bucket: ${APP_STORAGE_BUCKET:interview}
    region: ${APP_STORAGE_REGION:us-east-1}
  ai:
    #默认使用的Provider
    default-provider: dashscope
    #结构化输出重试配置
    structured:
      max-attempts: 2      #解析失败之后最多重试1（共尝试1次）
      include-last-error: true      #重试时将错误注入提示词
    #多Provider定义
    providers:
      dashscope:
        base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
        api-key: ${AI_BAILIAN_API_KEY}
        model: qwen3.7-flash
        temperature: 0.7
      deepseek:
        base-url: https://api.deepseek.com
        api-key: ${PROVIDER_DEEPSEEK_API_KEY}
        model: deepseek-v4-pro
        temperature: 0.7
      kimi:
        base-url: https://api.moonshot.cn/v1
        api-key: ${PROVIDER_KIMI_API_KEY}
        model: kimi—latest
        temperature: 0.7

  file:
    max-size: 52428800
    allowed-types:
      - application/pdf
      - application/msword
      - application/vnd.openxmlformats-officedocument.wordprocessingml.document
      - text/plain

interview:
  follow-up-count: ${APP_INTERVIEW_FOLLOW_UP_COUNT}
  # Skill 面试方向定义（key 为 skillId）
  skills:
    java-backend:
      name: Java 后端
      description: Java 核心、Spring 生态、并发、JVM、分布式、数据库等
      default-question-count: ${DEFAULT_QUESTION_COUNT}
    frontend:
      name: 前端
      description: JavaScript/TypeScript、框架原理、浏览器、工程化等
      default-question-count: ${DEFAULT_QUESTION_COUNT}
      python:
        name: Python
        description: Python 基础、常用框架、数据分析等
        default-question-count: ${DEFAULT_QUESTION_COUNT}
      algorithm:
        name: 算法
        description: 数据结构、算法思想、复杂度分析等
        default-question-count: ${DEFAULT_QUESTION_COUNT}
      system-design:
        name: 系统设计
        description: 高并发、高可用、缓存、消息队列、微服务等
        default-question-count: ${DEFAULT_QUESTION_COUNT}
      database:
        name: 数据库
        description: MySQL、索引、事务、锁、Redis、分库分表等
        default-question-count: ${DEFAULT_QUESTION_COUNT}


management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
