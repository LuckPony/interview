services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: iv-postgres
    environment:
      POSTGRES_USER: pony
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: interview
    ports:
      - "5432:5432"
    volumes:
      - iv_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: iv-redis
    ports:
      - "6379:6379"
    volumes:
      - iv_redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio
    container_name: iv-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - iv_minio_data:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 5s
      timeout: 3s
      retries: 5


volumes:
  iv_postgres_data:
  iv_redis_data:
  iv_minio_data: