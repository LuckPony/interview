name: Probe server connectivity (temp)

# 临时诊断：从 GitHub Actions 机器实测能连通服务器哪些端口（机房 NAT/防火墙排查用）。
# 用后即删。
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe ports
        shell: bash
        run: |
          HOST=103.236.92.40
          for port in 22 80 37777 23333 5678 5454; do
            if timeout 8 bash -c "echo > /dev/tcp/$HOST/$port" 2>/dev/null; then
              echo "port $port: OPEN"
            else
              echo "port $port: closed/timeout"
            fi
          done
          echo "--- http probes ---"
          for url in "http://$HOST/" "http://$HOST:23333/actuator/health" "http://$HOST:5678/"; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 8 "$url" 2>/dev/null || echo ERR)
            echo "$url -> $code"
          done
