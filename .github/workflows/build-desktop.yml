name: Build desktop packages

on:
  workflow_dispatch:
  push:
    branches: [main]

# 同一时间只跑一个打包流水线；新 push 直接取消旧 run（避免旧产物覆盖新 release）
concurrency:
  group: desktop-build
  cancel-in-progress: true

permissions:
  contents: write

env:
  # 后端部署在服务器：桌面端只打包「Electron 壳 + 前端 SPA」（云模式）。
  # 前端构建时把 API 地址烘焙为 MIANBA_SERVER，config.json 写入 serverUrl →
  # 应用启动即云模式（不拉本地后端）。仓库需配置同名 Secret。
  MIANBA_SERVER: ${{ secrets.MIANBA_SERVER }}

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: win-x64
            target: win
            artifact: windows-package
          # mac 只用一个 macos-latest（arm64）runner，交叉编译 x64 + arm64 两套包
          - os: macos-latest
            label: mac-x64+arm64
            target: mac
            artifact: macos-package

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            interview-desktop/package-lock.json

      - name: Check MIANBA_SERVER secret
        shell: bash
        run: |
          if [ -z "$MIANBA_SERVER" ]; then
            echo "::error::缺少 MIANBA_SERVER 仓库 Secret（后端服务器地址，云打包用它把前端 API 地址烘焙进安装包）。请在仓库 Settings → Secrets 里配置后重试。"
            exit 1
          fi

      - name: Install deps and build SPA (cloud)
        shell: bash
        run: |
          npm --prefix frontend ci
          npm --prefix interview-desktop ci
          cd interview-desktop
          node scripts/build-cloud.js

      # ---------------- Windows（云模式：只打包前端） ----------------
      - name: Build Windows package
        if: matrix.target == 'win'
        shell: bash
        run: |
          cd interview-desktop
          npx electron-builder --win --x64 --config electron-builder.cloud.yml --publish never

      # ---------------- macOS：单 runner 交叉编译 x64 + arm64（云模式） ----------------
      - name: Build macOS arm64 package
        if: matrix.target == 'mac'
        shell: bash
        run: |
          cd interview-desktop
          npx electron-builder --mac --arm64 --config electron-builder.cloud.yml --publish never

      - name: Build macOS x64 package
        if: matrix.target == 'mac'
        shell: bash
        run: |
          cd interview-desktop
          npx electron-builder --mac --x64 --config electron-builder.cloud.yml --publish never

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            interview-desktop/dist-electron-cloud/*.exe
            interview-desktop/dist-electron-cloud/*.dmg
            interview-desktop/dist-electron-cloud/*.zip
            interview-desktop/dist-electron-cloud/*.yml
            interview-desktop/dist-electron-cloud/*.blockmap
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION="$(node -p "require('./interview-desktop/package.json').version")"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid desktop version: $VERSION" >&2
            exit 1
          fi
          printf 'version=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: '*-package'
          merge-multiple: true
          path: release-assets

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          mapfile -d '' ASSETS < <(find release-assets -maxdepth 1 -type f \
            \( -name '*.exe' -o -name '*.dmg' -o -name '*.zip' -o -name '*.yml' -o -name '*.blockmap' \) \
            -print0)
          if [ "${#ASSETS[@]}" -eq 0 ]; then
            echo "No releasable files found" >&2
            find release-assets -maxdepth 2 -print
            exit 1
          fi
          printf 'Uploading %s\n' "${ASSETS[@]}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --target "${{ github.sha }}" --title "面霸 $TAG" --generate-notes
          gh release upload "$TAG" "${ASSETS[@]}" --clobber
