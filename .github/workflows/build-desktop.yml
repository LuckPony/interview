name: Build desktop packages

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

env:
  # jlink 精简 JRE 的模块清单（win/mac 共用）
  JLINK_MODULES: "java.base,java.compiler,java.datatransfer,java.desktop,java.instrument,java.logging,java.management,java.naming,java.net.http,java.prefs,java.rmi,java.scripting,java.security.jgss,java.security.sasl,java.smartcardio,java.sql,java.sql.rowset,java.transaction.xa,java.xml,java.xml.crypto,jdk.crypto.ec,jdk.crypto.cryptoki,jdk.jfr,jdk.management,jdk.management.agent,jdk.net,jdk.nio.mapmode,jdk.unsupported,jdk.zipfs"

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: win-x64
            target: win
            config: electron-builder.win.yml
            artifact: windows-package
          # mac 只用一个 macos-latest（arm64）runner，交叉编译 x64 + arm64 两套包
          - os: macos-latest
            label: mac-x64+arm64
            target: mac
            config: electron-builder.yml
            artifact: macos-package

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            interview-desktop/package-lock.json

      - name: Build backend
        shell: bash
        run: ./gradlew :app:bootJar --console=plain

      - name: Install deps and build SPA
        shell: bash
        run: |
          npm --prefix frontend ci
          npm --prefix interview-desktop ci
          cd interview-desktop
          npm run sync-spa

      # ---------------- Windows ----------------
      - name: Prepare embedded runtime (Windows)
        if: matrix.target == 'win'
        shell: bash
        run: |
          rm -rf runtime runtime-win
          JLINK_OUTPUT="$RUNNER_TEMP/mianba-jre-win"
          rm -rf "$JLINK_OUTPUT"
          mkdir -p runtime
          JAVA_HOME_UNIX="$(cygpath -u "$JAVA_HOME")"
          "$JAVA_HOME_UNIX/bin/jlink.exe" --module-path "$JAVA_HOME_UNIX/jmods" --add-modules "$JLINK_MODULES" \
            --output "$JLINK_OUTPUT" --strip-debug --no-header-files --no-man-pages --compress=2
          test -x "$JLINK_OUTPUT/bin/java.exe" || (echo "jlink did not create a usable runtime"; exit 1)
          mv "$JLINK_OUTPUT" runtime/jre
          cp app/build/libs/app-0.0.1-SNAPSHOT.jar runtime/app.jar
          mv runtime runtime-win

      - name: Build Windows package
        if: matrix.target == 'win'
        shell: bash
        run: |
          cd interview-desktop
          npx electron-builder --win --x64 --config electron-builder.win.yml --publish never

      # ---------------- macOS：单 runner 交叉编译 x64 + arm64 ----------------
      - name: Fetch x64 JDK (Intel JRE 交叉 jlink 用)
        if: matrix.target == 'mac'
        shell: bash
        run: |
          # arm64 runner 上跑 x64 JDK 需要 Rosetta 2；已装则跳过
          arch -x86_64 /usr/bin/true 2>/dev/null || softwareupdate --install-rosetta --agree-to-license 2>/dev/null || true
          curl -fsSL "https://api.adoptium.net/v3/binary/latest/21/ga/mac/x64/jdk/hotspot/normal/eclipse" \
            -o "$RUNNER_TEMP/jdk-x64.tar.gz"
          rm -rf "$RUNNER_TEMP/jdk-x64"
          mkdir -p "$RUNNER_TEMP/jdk-x64"
          tar -xzf "$RUNNER_TEMP/jdk-x64.tar.gz" -C "$RUNNER_TEMP/jdk-x64" --strip-components=1
          echo "JAVA_HOME_X64=$RUNNER_TEMP/jdk-x64/Contents/Home" >> "$GITHUB_ENV"
          test -x "$RUNNER_TEMP/jdk-x64/Contents/Home/bin/jlink" || (echo "x64 JDK missing jlink"; exit 1)

      - name: Build macOS arm64 package
        if: matrix.target == 'mac'
        shell: bash
        run: |
          rm -rf runtime
          mkdir -p runtime
          JLINK_OUTPUT="$RUNNER_TEMP/mianba-jre-arm64"
          rm -rf "$JLINK_OUTPUT"
          "$JAVA_HOME/bin/jlink" --module-path "$JAVA_HOME/jmods" --add-modules "$JLINK_MODULES" \
            --output "$JLINK_OUTPUT" --strip-debug --no-header-files --no-man-pages --compress=2
          test -x "$JLINK_OUTPUT/bin/java" || (echo "jlink did not create a usable runtime"; exit 1)
          mv "$JLINK_OUTPUT" runtime/jre
          cp app/build/libs/app-0.0.1-SNAPSHOT.jar runtime/app.jar
          cd interview-desktop
          npx electron-builder --mac --arm64 --config electron-builder.yml --publish never

      - name: Build macOS x64 package
        if: matrix.target == 'mac'
        shell: bash
        run: |
          rm -rf runtime
          mkdir -p runtime
          JLINK_OUTPUT="$RUNNER_TEMP/mianba-jre-x64"
          rm -rf "$JLINK_OUTPUT"
          "$JAVA_HOME_X64/bin/jlink" --module-path "$JAVA_HOME_X64/jmods" --add-modules "$JLINK_MODULES" \
            --output "$JLINK_OUTPUT" --strip-debug --no-header-files --no-man-pages --compress=2
          test -x "$JLINK_OUTPUT/bin/java" || (echo "jlink did not create a usable runtime"; exit 1)
          mv "$JLINK_OUTPUT" runtime/jre
          cp app/build/libs/app-0.0.1-SNAPSHOT.jar runtime/app.jar
          cd interview-desktop
          npx electron-builder --mac --x64 --config electron-builder.yml --publish never

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            interview-desktop/dist-electron/*.exe
            interview-desktop/dist-electron/*.dmg
            interview-desktop/dist-electron/*.zip
            interview-desktop/dist-electron/*.yml
            interview-desktop/dist-electron/*.blockmap
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION="$(node -p "require('./interview-desktop/package.json').version")"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid desktop version: $VERSION" >&2
            exit 1
          fi
          printf 'version=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: '*-package'
          merge-multiple: true
          path: release-assets

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          mapfile -d '' ASSETS < <(find release-assets -maxdepth 1 -type f \
            \( -name '*.exe' -o -name '*.dmg' -o -name '*.zip' -o -name '*.yml' -o -name '*.blockmap' \) \
            -print0)
          if [ "${#ASSETS[@]}" -eq 0 ]; then
            echo "No releasable files found" >&2
            find release-assets -maxdepth 2 -print
            exit 1
          fi
          printf 'Uploading %s\n' "${ASSETS[@]}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --target "${{ github.sha }}" --title "面霸 $TAG" --generate-notes
          gh release upload "$TAG" "${ASSETS[@]}" --clobber
